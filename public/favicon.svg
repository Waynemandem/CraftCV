<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Planet gradient: deep purple to lighter purple -->
    <radialGradient id="planet-grad" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="75%" stop-color="#5B3FA6"/>
      <stop offset="100%" stop-color="#3D2B6B"/>
    </radialGradient>

    <!-- Shine highlight on planet -->
    <radialGradient id="shine" cx="28%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5B3FA6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Clip for ring behind planet -->
    <clipPath id="ring-back">
      <rect x="0" y="0" width="32" height="64"/>
    </clipPath>

    <!-- Clip for ring in front of planet -->
    <clipPath id="ring-front">
      <rect x="32" y="0" width="32" height="64"/>
    </clipPath>

    <!-- Clip planet circle -->
    <clipPath id="planet-clip">
      <circle cx="32" cy="32" r="18"/>
    </clipPath>

    <!-- Glow filter -->
    <filter id="planet-glow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ring behind planet (darker/partially hidden) -->
  <g clip-path="url(#ring-back)" opacity="0.55">
    <ellipse cx="32" cy="32" rx="26" ry="8" fill="none" stroke="url(#ring-grad)" stroke-width="3.5" transform="rotate(-22 32 32)"/>
  </g>

  <!-- Planet with glow -->
  <g filter="url(#planet-glow)">
    <!-- Main sphere -->
    <circle cx="32" cy="32" r="18" fill="url(#planet-grad)"/>

    <!-- Atmospheric bands -->
    <g clip-path="url(#planet-clip)">
      <ellipse cx="32" cy="27" rx="18" ry="2.5" fill="#A78BFA" opacity="0.25"/>
      <ellipse cx="32" cy="32" rx="18" ry="3" fill="#7C3AED" opacity="0.2"/>
      <ellipse cx="32" cy="37" rx="18" ry="2" fill="#5B3FA6" opacity="0.18"/>
    </g>

    <!-- Shine/highlight -->
    <circle cx="32" cy="32" r="18" fill="url(#shine)"/>
  </g>

  <!-- Ring in front of planet (fully visible) -->
  <g clip-path="url(#ring-front)">
    <ellipse cx="32" cy="32" rx="26" ry="8" fill="none" stroke="url(#ring-grad)" stroke-width="3.5" transform="rotate(-22 32 32)"/>
  </g>

</svg>
